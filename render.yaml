services:
  - type: web
    name: rushd-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RUSHD_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rushd-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: "sasha th34**"
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: rushd-db
    plan: free
    databaseName: rushd
    user: rushd
